<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Collectly icon: nested lanes converging into one upward arrow (many inputs, one place). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06286e"/>
      <stop offset="0.5" stop-color="#172b55"/>
      <stop offset="1" stop-color="#3b4552"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a6ae0"/>
      <stop offset="1" stop-color="#0a50c2"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0.4" x2="0" y2="1">
      <stop offset="0" stop-color="#16cddc"/>
      <stop offset="1" stop-color="#1498cf"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ad282"/>
      <stop offset="1" stop-color="#2fa97c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#030b20" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g filter="url(#shadow)" stroke-linejoin="round" stroke-width="3">
      <!-- arrow, shaft and outer blue lane as one shape -->
      <path d="M256 53 L332 158 H288 V200 C288 222 296 236 306 250 L365 316 Q390 345 390 375 V540 H122 V375 Q122 345 147 316 L206 250 C216 236 224 222 224 200 V158 H180 Z"
            fill="url(#blue)" stroke="#4a95f2" stroke-opacity="0.8"/>
      <!-- gap -->
      <path d="M256 232 L184 330 Q155 368 155 400 V540 H357 V400 Q357 368 328 330 Z" fill="#17264a" stroke="none"/>
      <!-- cyan lane -->
      <path d="M256 270 L192 358 Q171 386 171 410 V540 H341 V410 Q341 386 320 358 Z" fill="url(#cyan)" stroke="#5fe3ee" stroke-opacity="0.7"/>
      <!-- gap -->
      <path d="M256 331 L218 383 Q205 401 205 420 V540 H307 V420 Q307 401 294 383 Z" fill="#17264a" stroke="none"/>
      <!-- green core -->
      <path d="M256 357 L226 396 Q222 401 222 408 V540 H290 V408 Q290 401 286 396 Z" fill="url(#green)" stroke="#6ee39d" stroke-opacity="0.6"/>
    </g>
  </g>
</svg>
