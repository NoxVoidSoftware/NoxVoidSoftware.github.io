<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Wishly icon: idea lightbulb with an upvote chevron (public ideas + votes). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3f7b"/>
      <stop offset="1" stop-color="#0d2149"/>
    </linearGradient>
    <linearGradient id="mark" x1="256" y1="96" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c3d6"/>
      <stop offset="1" stop-color="#43cf80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#050d24" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round">
    <!-- bulb -->
    <path d="M206 330 C206 296 156 270 156 204 A100 100 0 0 1 356 204 C356 270 306 296 306 330 Z" stroke-width="30"/>
    <path d="M214 376 H298 M232 414 H280" stroke-width="26"/>
    <!-- upvote chevron inside the bulb -->
    <path d="M214 232 L256 190 L298 232" stroke-width="28"/>
  </g>
</svg>
